# `docker compose --env-file .env.secret up --build` runs the full stack: the
# mem0 release on http://localhost:4000, Postgres, and Ollama for embeddings.
# `docker compose up db` still works for host-side development.
services:
  app:
    build: .
    ports: ["4000:4000"]
    environment:
      DATABASE_URL: ecto://postgres:postgres@db/mem0_dev
      # Local default; override for anything reachable from another machine.
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-8c7nI6sqeZirCQ+0a20tCWafOrH4UUM6Ih67i7DP3PGJFUIuXeYniM0bJ2DsMICm}
      PHX_HOST: localhost
      MEM0_EMBEDDER_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      MEM0_LLM_PROVIDER:
      ANTHROPIC_API_KEY:
      OPENROUTER_API_KEY:
      MEM0_LLM_BASE_URL:
      MEM0_LLM_MODEL:
      MEM0_LLM_MAX_TOKENS:
      MEM0_LLM_EFFORT:
      MEM0_EMBEDDING_MODEL:
      MEM0_EMBEDDING_DIMENSIONS:
      MEM0_DEFAULT_USER_ID:
      MEM0_LOG_LLM_PAYLOADS:
    command: ["/bin/sh", "-c", "/app/bin/migrate && /app/bin/server"]
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mem0_dev
    ports: ["5432:5432"]
    volumes: [mem0_pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    entrypoint:
      - /bin/sh
      - -c
      - |
        ollama serve &
        until ollama ls >/dev/null 2>&1; do sleep 1; done
        ollama pull nomic-embed-text
        wait
    volumes: [mem0_ollama:/root/.ollama]
    healthcheck:
      test: ["CMD", "ollama", "ls"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mem0_pgdata:
  mem0_ollama:
